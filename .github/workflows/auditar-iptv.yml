name: Auditar disponibilidad IPTV (HLS)

on:
  workflow_dispatch:
  schedule:
    - cron: "38 5 * * *"
  push:
    branches: [main]
    paths:
      - "iptv-espanol/auditar_canales.py"
      - "iptv-espanol/filtrar_muertos.py"
      - ".github/workflows/auditar-iptv.yml"
  pull_request:
    branches: [main]
    paths:
      - "iptv-espanol/**"
      - ".github/workflows/auditar-iptv.yml"

permissions:
  contents: write

concurrency:
  group: iptv-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas offline
        run: python -m unittest discover -s iptv-espanol -p "test_*.py" -v

      - name: Refrescar playlists con nuevas fuentes
        run: python iptv-espanol/sincronizar_fuentes.py --force

      - name: Validar manifests y segmentos HLS
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python iptv-espanol/auditar_canales.py --workers 16 --timeout 4 --limit 120
          else
            python iptv-espanol/auditar_canales.py --workers 42 --timeout 4
          fi

      - name: Retirar solo streams reiteradamente rotos
        if: github.event_name != 'pull_request'
        run: python iptv-espanol/filtrar_muertos.py

      - name: Registrar lista depurada e informe
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv.m3u iptv-espanol/*.m3u iptv-espanol/ESTADISTICAS.txt
          git add iptv-espanol/fuentes_estado.json
          git add iptv-espanol/salud_canales.json iptv-espanol/REPORTE_SALUD.md
          if git diff --cached --quiet; then
            echo "Sin cambios en canales o salud"
          else
            git commit -m "Auditar y depurar disponibilidad IPTV"
            git push
          fi
