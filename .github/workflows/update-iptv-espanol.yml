name: Sincronizar IPTV con fuentes originales

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Cada tres horas, evitando el minuto 00 de mayor demanda.
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - "iptv-espanol/generar_listas.py"
      - "iptv-espanol/canales_monoserie.py"
      - "iptv-espanol/test_canales_monoserie.py"
      - "iptv-espanol/sincronizar_fuentes.py"
      - "iptv-espanol/filtrar_muertos.py"
      - "iptv-espanol/dead_urls.txt"
      - "iptv-espanol/test_sincronizar_fuentes.py"
      - "iptv-espanol/test_auditar_canales.py"
      - "iptv-espanol/auditar_canales.py"
      - ".github/workflows/update-iptv-espanol.yml"

permissions:
  contents: write

concurrency:
  group: iptv-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas offline
        run: python -m unittest discover -s iptv-espanol -p "test_*.py" -v

      - name: Verificar fuentes y actualizar solo si cambiaron
        run: python iptv-espanol/sincronizar_fuentes.py ${{ github.event_name != 'schedule' && '--force' || '' }}

      - name: Publicar solamente cambios validos
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "Rama desactualizada: regenerando sobre el último estado remoto"
              git reset --hard origin/main
              python iptv-espanol/sincronizar_fuentes.py --force
            fi
            git add iptv-espanol/24-7.m3u
            git add iptv-espanol/24-7-PENDIENTES.md
            git add iptv-espanol/peliculas.m3u
            git add iptv-espanol/series.m3u
            git add iptv-espanol/espanol.m3u
            git add iptv-espanol/por-pais.m3u
            git add iptv-espanol/por-categoria.m3u
            git add iptv-espanol/ecuador.m3u
            git add iptv-espanol/espanol-paises-y-categorias.m3u
            git add iptv-espanol/ESTADISTICAS.txt
            git add iptv-espanol/fuentes_estado.json
            git add tv.m3u
            if git diff --cached --quiet; then
              echo "Sin cambios: no publicar commit"
              exit 0
            fi
            git commit -m "Sincronizar IPTV con fuentes oficiales"
            if git push origin HEAD:main; then exit 0; fi
            echo "Conflicto de publicación. Reintentando sin sobrescribir..."
          done
          exit 1
