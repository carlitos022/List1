name: Actualizar IPTV español

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"
  push:
    branches: [main]
    paths:
      - "iptv-espanol/generar_listas.py"
      - ".github/workflows/update-iptv-espanol.yml"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar listas
        run: python iptv-espanol/generar_listas.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv-espanol/espanol.m3u
          git add iptv-espanol/por-pais.m3u
          git add iptv-espanol/por-categoria.m3u
          git add iptv-espanol/ecuador.m3u
          git add iptv-espanol/espanol-paises-y-categorias.m3u
          git add iptv-espanol/ESTADISTICAS.txt
          git add tv.m3u
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar listas IPTV en español"
            git push
          fi
